name: CI

on:
  push:
    branches:
      - main
      - dev/first-runnable
  pull_request:
    branches:
      - main
      - dev/first-runnable

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:run

      - name: Production build
        run: npm run build