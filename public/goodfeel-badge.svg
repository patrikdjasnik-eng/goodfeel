    </linearGradient>
    <linearGradient id="accent" x1="11" y1="7" x2="31" y2="31" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7a43ff"/>
      <stop offset="0.52" stop-color="#6436fa"/>
